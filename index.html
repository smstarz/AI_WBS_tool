      function clearDetailPanel() {
        if (!detailPanel) {
          return;
        }
        detailPanel.innerHTML = detailPanelDefault;
      }

      function updateRowSelection() {
        const rows = document.querySelectorAll('.gtasktable tr.task-row');
        rows.forEach(row => {
          const isMatch = selectedTaskWbsId && row.dataset.wbsId === selectedTaskWbsId;
          row.classList.toggle('is-selected', Boolean(isMatch));
          row.setAttribute('aria-selected', isMatch ? 'true' : 'false');
        });
      }

      function focusRowByWbsId(wbsId) {
        if (!wbsId) return;
        const selector = '.gtasktable tr.task-row[data-wbs-id="' + cssEscape(wbsId) + '"]';
        const targetRow = document.querySelector(selector);
        if (targetRow && typeof targetRow.focus === 'function') {
          targetRow.focus({ preventScroll: true });
        }
      }

      function cssEscape(value) {
        if (typeof CSS !== 'undefined' && typeof CSS.escape === 'function') {
          return CSS.escape(value);
        }
        return value.replace(/["\\]/g, '\\$&');
      }

      function setStatus(message, type) {
        if (!statusMessage) return;
        if (type === 'error') {
          statusMessage.textContent = message || '';
          statusMessage.classList.add('error');
          return;
        }
        statusMessage.classList.remove('error');
        statusMessage.textContent = '';
      }

      function renderFatalError(error) {
        console.error(error);
        const message = error && error.message ? error.message : '알 수 없는 오류';
        target.innerHTML =
          '<div class="error">간트 차트를 불러오는 중 오류가 발생했습니다.<br>' +
          message +
          '<br><br>브라우저에서 직접 file://로 열면 CSV를 읽지 못할 수 있으니, 간단한 로컬 서버(예: <code>npx serve</code>)로 열어보세요.' +
          '</div>';
        setStatus(message, 'error');
      }
      function normalizeTaskTable(chart) {
        if (!chart || !Array.isArray(chart.vTaskList)) {
          return;
        }

        document.querySelectorAll('.gselector, .gselector-static').forEach(el => el.remove());

        const applyWidth = (cell, width) => {
          cell.style.width = width + 'px';
          cell.style.minWidth = width + 'px';
          cell.style.maxWidth = width + 'px';
        };

        const formatDateValue = value => {
          if (!value) return '';
          const trimmed = value.toString().trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
            return trimmed;
          }
          const parsed = new Date(trimmed);
          if (!isNaN(parsed.getTime())) {
            return parsed.toISOString().slice(0, 10);
          }
          const parts = trimmed.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
          if (parts) {
            const [, y, m, d] = parts;
            return [
              y.padStart(4, '0'),
              m.padStart(2, '0'),
              d.padStart(2, '0')
            ].join('-');
          }
          return trimmed;
        };

        const reorderRow = (row, isHeader, dataObject, taskItem) => {
          if (!row) return;
          const cells = Array.from(row.children);
          const cellByClass = new Map();
          cells.forEach(cell => {
            const match = TASK_TABLE_COLUMNS.find(cfg => cell.classList.contains(cfg.cls));
            if (match) {
              cellByClass.set(match.cls, cell);
            }
          });

        const newCells = TASK_TABLE_COLUMNS.map(column => {
          const hadCell = cellByClass.has(column.cls);
          let cell = hadCell ? cellByClass.get(column.cls) : null;
          if (!cell) {
            cell = document.createElement('td');
            cell.className = column.cls;
          }
          if (isHeader) {
            cell.innerHTML = '';
            if (typeof column.renderHeader === 'function') {
              column.renderHeader(cell);
            } else {
              cell.textContent = column.label || '\u00A0';
            }
          } else if (dataObject) {
            if (column.cls === 'gtasklist') {
              cell.innerHTML = '';
              cell.classList.add('hierarchy-cell');
              const isGroupTask =
                taskItem && typeof taskItem.getGroup === 'function' && taskItem.getGroup() === 1;
              if (isGroupTask && typeof taskItem.getID === 'function') {
                const toggleBtn = document.createElement('button');
                const originalId = taskItem.getID();
                const isOpen = typeof taskItem.getOpen === 'function' ? taskItem.getOpen() === 1 : true;
                toggleBtn.type = 'button';
                toggleBtn.className = 'hierarchy-toggle' + (isOpen ? ' is-open' : '');
                toggleBtn.setAttribute('aria-label', (isOpen ? '하위 작업 접기' : '하위 작업 펼치기'));
                toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                toggleBtn.textContent = isOpen ? '-' : '+';
                toggleBtn.addEventListener('click', event => {
                  event.preventDefault();
                  event.stopPropagation();
                  if (typeof JSGantt !== 'undefined' && typeof JSGantt.folder === 'function') {
                    JSGantt.folder(originalId, chart);
                  }
                  if (dataObject && dataObject.wbsId) {
                    selectTaskByWbsId(dataObject.wbsId);
                  }
                  setTimeout(() => {
                    normalizeTaskTable(chart);
                    makeTableEditable(chart);
                    updateRowSelection();
                  }, 0);
                });
                cell.appendChild(toggleBtn);
              } else {
                const spacer = document.createElement('span');
                spacer.className = 'hierarchy-placeholder';
                cell.appendChild(spacer);
              }
            } else {
              let value = column.field ? dataObject[column.field] : '';
              if (column.fallbackField && (value === undefined || value === null || value === '')) {
                value = dataObject[column.fallbackField];
              }
              if (column.isDate) {
                value = formatDateValue(value);
              }
              if (typeof column.formatter === 'function') {
                try {
                  value = column.formatter(value, dataObject);
                } catch {
                  // ignore formatter errors
                }
              }
              if (value === undefined || value === null) {
                value = '';
              }
              const asString = value.toString();
              if (column.cls === 'gtaskname') {
                const levelNumber = Number.parseInt(dataObject.level, 10);
                const depth = Number.isNaN(levelNumber) ? 0 : Math.max(0, levelNumber - 1);
                cell.textContent = asString;
                cell.style.paddingLeft = depth > 0 ? depth * 16 + 'px' : '';
              } else {
                cell.textContent = asString;
                if (column.cls !== 'gtaskname') {
                  cell.style.removeProperty('padding-left');
                }
              }
            }
          }
          applyWidth(cell, column.width);
          return cell;
        });

          while (row.firstChild) {
            row.removeChild(row.firstChild);
          }
          newCells.forEach(cell => row.appendChild(cell));
        };

        const headerRow = document.querySelector('.gtasktableh tbody tr:nth-child(2)');
        if (headerRow) {
          reorderRow(headerRow, true, null, null);
        }

        const spanningHeaderRow = document.querySelector('.gtasktableh tbody tr:first-child');
        if (spanningHeaderRow) {
          const spanningCell = spanningHeaderRow.querySelector('.gspanning');
          if (spanningCell) {
            const desiredColSpan = Math.max(1, TASK_TABLE_COLUMNS.length - 1);
            if (spanningCell.colSpan !== desiredColSpan) {
              spanningCell.colSpan = desiredColSpan;
            }
            spanningCell.innerHTML = '';
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'task-add-btn';
            addBtn.textContent = 'add Task';
            addBtn.addEventListener('click', event => {
              event.preventDefault();
              openAddTaskModal();
            });
            spanningCell.appendChild(addBtn);
          }
        }

        chart.vTaskList.forEach(task => {
          if (typeof task.getListChildRow !== 'function') return;
          const row = task.getListChildRow();
          if (!row) return;
          const dataObject = typeof task.getDataObject === 'function' ? task.getDataObject() : null;
          reorderRow(row, false, dataObject, task);
          row.classList.add('task-row');
          if (!row.hasAttribute('role')) {
            row.setAttribute('role', 'row');
          }
          if (dataObject && dataObject.wbsId) {
            row.dataset.wbsId = dataObject.wbsId;
            row.tabIndex = 0;
            row.onclick = event => {
              if (
                activeEditor &&
                activeEditor.input &&
                activeEditor.input.contains(event.target)
              ) {
                event.stopPropagation();
                return;
              }
              selectTaskByWbsId(dataObject.wbsId);
            };
            row.onkeydown = event => {
              if (
                activeEditor &&
                activeEditor.input &&
                activeEditor.input.contains(event.target)
              ) {
                event.stopPropagation();
                return;
              }
              const tag = event.target && event.target.tagName;
              if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
                event.stopPropagation();
                return;
              }
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                event.stopPropagation();
                selectTaskByWbsId(dataObject.wbsId);
              }
            };
          }
        });

        const footerRow = document.querySelector('.gtasktable tbody tr:last-child');
        if (footerRow) {
          reorderRow(footerRow, true);
        }
        updateRowSelection();
      }

      function resolveInlineErrorHost(target) {
        if (!target) {
          return null;
        }
        if (target.classList && target.classList.contains('detail-panel__value')) {
          return target;
        }
        if (typeof target.closest === 'function') {
          const detailValue = target.closest('.detail-panel__value');
          if (detailValue) {
            return detailValue;
          }
          const cell = target.closest('td');
          if (cell) {
            return cell;
          }
        }
        return target;
      }

      function showInlineError(target, message) {
        const host = resolveInlineErrorHost(target);
        if (!host) {
          return;
        }
        host.classList.add('has-inline-error');
        if (host.dataset) {
          host.dataset.inlineError = message || '입력값이 올바르지 않습니다.';
        } else {
          host.setAttribute('data-inline-error', message || '입력값이 올바르지 않습니다.');
        }
      }

      function clearInlineError(target) {
        const host = resolveInlineErrorHost(target);
        if (!host) {
          return;
        }
        host.classList.remove('has-inline-error');
        if (host.dataset && Object.prototype.hasOwnProperty.call(host.dataset, 'inlineError')) {
          delete host.dataset.inlineError;
        } else {
          host.removeAttribute('data-inline-error');
        }
      }

      function resetDetailInputValue(control, editorConfig, recordValue, record) {
        if (!control) {
          return;
        }
        let nextValue;
        if (editorConfig && typeof editorConfig.toInputValue === 'function') {
          try {
            nextValue = editorConfig.toInputValue(recordValue, record);
          } catch {
            nextValue = recordValue;
          }
        } else {
          nextValue = recordValue;
        }
        if (
          nextValue &&
          typeof nextValue === 'object' &&
          Object.prototype.hasOwnProperty.call(nextValue, 'value')
        ) {
          nextValue = nextValue.value;
        }
        if (nextValue === undefined || nextValue === null) {
          control.value = '';
        } else {
          control.value = nextValue.toString();
        }
      }

      function makeTableEditable(chart) {
        const table = document.querySelector('.gtasktable');
        if (!table) return;
        if (table.dataset.editableBound === 'true') {
          return;
        }
        table.dataset.editableBound = 'true';

        function cancelActiveEditor() {
          if (!activeEditor) {
            return;
          }
          closeEditor(activeEditor, { revert: true });
        }
        if (typeof globalThis !== 'undefined') {
          globalThis.__cancelTaskTableEditor = cancelActiveEditor;
        }

        function closeEditor(editor, options = {}) {
          if (!editor) return;
          const { cell, input, config, column } = editor;
          const { revert = false, displayValue, preserveInlineError = false } = options;
          input.removeEventListener('blur', editor.handleBlur);
          input.removeEventListener('keydown', editor.handleKeydown);
          if (editor.handleInput) {
            input.removeEventListener('input', editor.handleInput);
          }
          if (config.element === 'select' && editor.handleChange) {
            input.removeEventListener('change', editor.handleChange);
          }
          editor.isCommitting = false;
          cell.classList.remove('is-editing');
          cell.innerHTML = '';
          if (!preserveInlineError) {
            clearInlineError(cell);
          }
          const valueForDisplay = revert
            ? editor.originalDisplay
            : displayValue !== undefined
            ? displayValue
            : formatCellDisplay(column, editor.originalValue);
          cell.textContent = valueForDisplay;
          if (activeEditor === editor) {
            activeEditor = null;
          }
        }

        function commitEdit(editor) {
          if (!editor || activeEditor !== editor) {
            return;
          }
          if (editor.isCommitting) {
            return;
          }
          editor.isCommitting = true;
          const { input, config, record, wbsId, column, cell } = editor;
          let parsedValue;
          try {
            parsedValue = config.parse(
              config.element === 'select' ? input.value : input.value,
              { record, wbsId }
            );
          } catch (error) {
            showInlineError(cell, error.message || '입력값이 올바르지 않습니다.');
            editor.isCommitting = false;
            closeEditor(editor, { revert: true, preserveInlineError: true });
            setTimeout(() => {
              beginEdit(cell);
            }, 0);
            return;
          }

          const currentValue = record ? record[config.field] : undefined;
          if (valuesEqual(currentValue, parsedValue, config)) {
            closeEditor(editor, { displayValue: formatCellDisplay(column, currentValue) });
            editor.isCommitting = false;
            return;
          }

          let applyResult;
          try {
            applyResult = applyCellValue({
              wbsId,
              field: config.field,
              value: parsedValue,
              record
            });
          } catch (error) {
            showInlineError(cell, error.message || '작업을 업데이트하지 못했습니다.');
            editor.isCommitting = false;
            closeEditor(editor, { revert: true, preserveInlineError: true });
            setTimeout(() => {
              beginEdit(cell);
            }, 0);
            return;
          }

          clearInlineError(cell);
          closeEditor(editor, { displayValue: formatCellDisplay(column, parsedValue) });
          editor.isCommitting = false;
          if (selectedTaskWbsId === wbsId) {
            selectTaskByWbsId(wbsId, { suppressFocus: true });
          }
          if (applyResult && applyResult.taskUpdated) {
            refreshChartSurface();
          } else {
            renderChart(currentRows);
          }
          if (applyResult) {
            queueFieldAutoSave({
              wbsId,
              field: config.field,
              value: record ? record[config.field] : parsedValue,
              previousValue: applyResult.previousValue,
              record
            });
          }
        }

        function beginEdit(cell) {
          if (!cell || cell.classList.contains('gtaskid') || cell.classList.contains('gtasklist')) {
            return;
          }
          if (cell.classList.contains('is-editing')) {
            return;
          }
          const columnClass = EDITABLE_CLASS_NAMES.find(cls => cell.classList.contains(cls));
          if (!columnClass) {
            return;
          }
          const config = EDITABLE_COLUMN_CONFIG[columnClass];
          if (!config) {
            return;
          }
          const column = TASK_COLUMN_BY_CLASS[columnClass];
          if (!column || !column.field) {
            return;
          }
          const row = cell.closest('tr');
          if (!row) {
            return;
          }
          const wbsIdCell = row.querySelector('.gtaskid');
          if (!wbsIdCell) {
            return;
          }
          const wbsId = wbsIdCell.textContent.trim();
          if (!wbsId) {
            return;
          }
          const record = currentRowLookup.get(wbsId) || null;
          const cellText = cell.textContent.trim();

          if (typeof config.canEdit === 'function') {
            const canEdit = config.canEdit({
              record,
              wbsId,
              column,
              cell,
              cellText
            });
            if (!canEdit) {
              if (config.blockedMessage) {
                showInlineError(cell, config.blockedMessage);
                setTimeout(() => clearInlineError(cell), 2400);
              }
              return;
            }
          }

          if (activeEditor && activeEditor.cell === cell) {
            return;
          }
          cancelActiveEditor();

          const context = {
            record,
            column,
            cellText,
            wbsId
          };
          const initialRecordValue = record ? record[config.field] : undefined;
          const rawInitialValue =
            typeof config.toInputValue === 'function'
              ? config.toInputValue(initialRecordValue, context)
              : initialRecordValue !== undefined
              ? initialRecordValue
              : context.cellText;
          let placeholderLabel = null;
          let initialValue = rawInitialValue;
          if (
            rawInitialValue &&
            typeof rawInitialValue === 'object' &&
            Object.prototype.hasOwnProperty.call(rawInitialValue, 'value')
          ) {
            placeholderLabel =
              typeof rawInitialValue.placeholder === 'string'
                ? rawInitialValue.placeholder
                : null;
            initialValue = rawInitialValue.value;
          }

          let input;
          if (config.element === 'select') {
            input = document.createElement('select');
            if (placeholderLabel) {
              const placeholderOption = document.createElement('option');
              placeholderOption.value = '';
              placeholderOption.textContent = placeholderLabel;
              placeholderOption.disabled = true;
              placeholderOption.selected = true;
              input.appendChild(placeholderOption);
            }
            config.options.forEach(optionValue => {
              const optionEl = document.createElement('option');
              optionEl.value = optionValue;
              optionEl.textContent = optionValue;
              input.appendChild(optionEl);
            });
          } else {
            input = document.createElement('input');
            input.type = config.inputType || 'text';
          }
          if (config.attributes) {
            Object.entries(config.attributes).forEach(([key, value]) => {
              if (value !== undefined && value !== null) {
                input.setAttribute(key, value);
              }
            });
          }

          if (config.element === 'select') {
            if (initialValue) {
              input.value = initialValue;
            } else if (!placeholderLabel && config.options.length) {
              input.value = config.options[0];
            }
          } else if (initialValue !== undefined && initialValue !== null) {
            input.value = initialValue.toString();
          } else {
            input.value = '';
          }

          if (config.inputType === 'date') {
            input.style.width = '80px';
            input.style.minWidth = '80px';
            input.style.maxWidth = '80px';
            input.style.fontSize = '12px';
          }

          if (config.element === 'select') {
            input.style.width = '50px';
            input.style.minWidth = '50px';
            input.style.maxWidth = '50px';
            input.style.fontSize = '12px';
          }

          if (config.field === 'weight') {
            const availableWidth = cell.clientWidth || column.width || 50;
            const targetWidth = Math.max(availableWidth - 6, 24);
            input.style.width = targetWidth + 'px';
            input.style.maxWidth = '100%';
            input.style.minWidth = '0';
            input.style.boxSizing = 'border-box';
          }

          const editor = {
            cell,
            input,
            config,
            column,
            wbsId,
            record,
            originalDisplay: cell.textContent,
            originalValue: initialRecordValue,
            handleBlur: null,
            handleKeydown: null,
            handleChange: null,
            handleInput: null,
            isCommitting: false
          };

          editor.handleBlur = () => {
            commitEdit(editor);
          };
          editor.handleKeydown = event => {
            event.stopPropagation();
            if (event.key === 'Enter') {
              event.preventDefault();
              commitEdit(editor);
            } else if (event.key === 'Escape') {
              event.preventDefault();
              closeEditor(editor, { revert: true });
            }
          };
          if (config.element === 'select') {
            editor.handleChange = () => {
              commitEdit(editor);
            };
            input.addEventListener('change', editor.handleChange);
          }
          input.addEventListener('blur', editor.handleBlur);
          input.addEventListener('keydown', editor.handleKeydown);
          editor.handleInput = () => {
            clearInlineError(cell);
          };
          input.addEventListener('input', editor.handleInput);

          cell.classList.add('is-editing');
          cell.innerHTML = '';
          cell.appendChild(input);
          activeEditor = editor;

          setTimeout(() => {
            input.focus();
            if (config.element !== 'select' && typeof input.select === 'function') {
              input.select();
            }
          }, 0);
        }

        table.addEventListener('dblclick', event => {
          if (
            activeEditor &&
            activeEditor.input &&
            activeEditor.input.contains(event.target)
          ) {
            return;
          }
          const cell = event.target.closest('td');
          if (!cell || !table.contains(cell)) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          beginEdit(cell);
        });
      }

      function formatGanttDateHeaders(chart) {
        if (!target || !chart) {
          return;
        }
        const headerTable = target.querySelector('.gcharttableh');
        if (!headerTable) {
          return;
        }
        const headerRows = headerTable.querySelectorAll('tr');
        if (headerRows.length < 2) {
          return;
        }
        const majorRow = headerRows[0];
        const minorRow = headerRows[1];
        const minorCells = Array.from(minorRow.querySelectorAll('td'));
        if (!minorCells.length) {
          return;
        }
        const timelineStart = (() => {
          if (typeof chart.getMinDate === 'function') {
            const explicit = chart.getMinDate();
            if (explicit instanceof Date) {
              return new Date(explicit.getTime());
            }
          }
          if (typeof JSGantt !== 'undefined' && typeof JSGantt.getMinDate === 'function') {
            const computed = JSGantt.getMinDate(
              chart.vTaskList || [],
              chart.vFormat || 'day',
              null
            );
            if (computed instanceof Date) {
              return new Date(computed.getTime());
            }
          }
          return null;
        })();
        if (!(timelineStart instanceof Date)) {
          return;
        }

        const formatMinorCell = (cell, date) => {
          const inner = cell.querySelector('div');
          if (inner) {
            inner.textContent = date.getDate();
          } else {
            cell.textContent = date.getDate();
          }
        };
        const calculateGroupWidth = (cells, startIndex, length) => {
          let total = 0;
          for (let i = 0; i < length; i += 1) {
            const cell = cells[startIndex + i];
            if (!cell) continue;
            if (typeof cell.getBoundingClientRect === 'function') {
              total += cell.getBoundingClientRect().width;
            } else if (typeof cell.offsetWidth === 'number') {
              total += cell.offsetWidth;
            }
          }
          return total;
        };
        const appendMonthCell = (row, span, label, width) => {
          if (!row || span <= 0) {
            return;
          }
          const cell = document.createElement('td');
          cell.className = 'gmajorheading custom-month-heading';
          cell.colSpan = span;
          const div = document.createElement('div');
          div.textContent = label;
          if (width > 0 && Number.isFinite(width)) {
            div.style.width = width + 'px';
          }
          cell.appendChild(div);
          row.appendChild(cell);
        };

        majorRow.innerHTML = '';
        let currentMonthKey = null;
        let currentMonthStartIndex = 0;
        let currentMonthLabel = '';

        minorCells.forEach((cell, index) => {
          const cellDate = addDays(timelineStart, index);
          if (!(cellDate instanceof Date)) {
            return;
          }
          formatMinorCell(cell, cellDate);
          const monthKey = cellDate.getFullYear() + '-' + cellDate.getMonth();
          if (currentMonthKey === null) {
            currentMonthKey = monthKey;
            currentMonthStartIndex = index;
            currentMonthLabel = formatMonthLabel(cellDate);
            return;
          }
          if (monthKey !== currentMonthKey) {
            const spanLength = index - currentMonthStartIndex;
            const monthWidth = calculateGroupWidth(minorCells, currentMonthStartIndex, spanLength);
            appendMonthCell(majorRow, spanLength, currentMonthLabel, monthWidth);
            currentMonthKey = monthKey;
            currentMonthStartIndex = index;
            currentMonthLabel = formatMonthLabel(cellDate);
          }
        });
        const finalSpanLength = minorCells.length - currentMonthStartIndex;
        if (finalSpanLength > 0) {
          const monthWidth = calculateGroupWidth(
            minorCells,
            currentMonthStartIndex,
            finalSpanLength
          );
          const monthDate = addDays(timelineStart, currentMonthStartIndex);
          appendMonthCell(majorRow, finalSpanLength, formatMonthLabel(monthDate), monthWidth);
        }
      }

      function applyCellValue({ wbsId, field, value, record }) {
        if (!wbsId || !field) {
          throw new Error('업데이트할 작업을 찾지 못했습니다.');
        }
        let targetRecord = record || currentRowLookup.get(wbsId) || null;
        if (!targetRecord) {
          const index = currentRows.findIndex(row => row.wbsId === wbsId);
          if (index === -1) {
            throw new Error('업데이트할 작업을 찾지 못했습니다.');
          }
          targetRecord = currentRows[index];
        }
        const previousValue = targetRecord[field];
        targetRecord[field] = value;
        if (field === 'startDate' || field === 'endDate') {
          const startMs = toUtcMidnight(targetRecord.startDate);
          const endMs = toUtcMidnight(targetRecord.endDate);
          if (startMs !== null && endMs !== null && startMs > endMs) {
            targetRecord[field] = previousValue;
            throw new Error('Start Date는 End Date보다 늦을 수 없습니다.');
          }
          updateRecordPlanned(targetRecord);
        }
        if (field === 'progress') {
          targetRecord.progressDisplay = Number.isFinite(targetRecord.progress)
            ? targetRecord.progress + '%'
            : '';
        }
        if (field === 'status') {
          targetRecord.status = normalizeStatusValue(targetRecord.status);
        }
        if (field === 'priority') {
          targetRecord.priority = normalizePriorityValue(targetRecord.priority);
        }
        if (field === 'level') {
          targetRecord.taskCssClass = getTaskClassName(targetRecord);
        }
        currentRowLookup.set(wbsId, targetRecord);
        if (field === 'weight' || field === 'progress' || field === 'startDate' || field === 'endDate') {
          updateValidationState(currentRows);
        } else {
          updateRecordValidation(targetRecord);
        }
        const taskUpdated = syncTaskItemWithRecord(targetRecord, field);
        return { previousValue, taskUpdated };
      }

      function syncTaskItemWithRecord(record, changedField) {
        if (
          !record ||
          !record.wbsId ||
          !ganttChart ||
          !Array.isArray(ganttChart.vTaskList) ||
          !ganttChart.vTaskList.length
        ) {
          return false;
        }
        const taskItem = ganttChart.vTaskList.find(item => {
          if (!item || typeof item.getDataObject !== 'function') {
            return false;
          }
          const data = item.getDataObject();
          return data && data.wbsId === record.wbsId;
        });
        if (!taskItem) {
          return false;
        }
        if (typeof taskItem.setDataObject === 'function') {
          taskItem.setDataObject(record);
        }
        const field = changedField;
        if (field === 'taskName' && typeof taskItem.setName === 'function') {
          taskItem.setName(record.taskName || record.wbsId);
        }
        if (field === 'startDate' || field === 'endDate') {
          if (typeof taskItem.setStart === 'function') {
            taskItem.setStart(toGanttStartOfDay(record.startDate));
          }
          if (typeof taskItem.setEnd === 'function') {
            taskItem.setEnd(toGanttInclusiveEnd(record.endDate));
          }
        }
        if (field === 'progress') {
          const numeric = Number.isFinite(record.progress) ? record.progress : 0;
          const captionValue = Number.isFinite(record.progress) ? record.progress + '%' : '';
          record.progressDisplay = captionValue;
          if (typeof taskItem.setComp === 'function') {
            taskItem.setComp(numeric);
          }
          if (typeof taskItem.setCompVal === 'function') {
            taskItem.setCompVal(numeric);
          }
        }
        if (field === 'level' && typeof taskItem.setClass === 'function') {
          const newClassName = getTaskClassName(record);
          record.taskCssClass = newClassName;
          taskItem.setClass(newClassName);
          if (typeof taskItem.setPlanClass === 'function') {
            taskItem.setPlanClass(newClassName);
          }
        }
        if (field === 'owner' && typeof taskItem.setResource === 'function') {
          taskItem.setResource(record.owner || '');
        }
        if (field === 'weight' && typeof taskItem.setWeight === 'function') {
          const weightValue = Number(record.weight);
          if (!Number.isNaN(weightValue)) {
            taskItem.setWeight(weightValue);
          }
        }
        return true;
      }

      function refreshChartSurface() {
        if (!ganttChart) {
          return;
        }
        updateAllPlanned(currentRows);
        ganttChart.Draw();
        if (typeof ganttChart.DrawDependencies === 'function') {
          ganttChart.DrawDependencies();
        }
        normalizeTaskTable(ganttChart);
        makeTableEditable(ganttChart);
        if (selectedTaskWbsId) {
          selectTaskByWbsId(selectedTaskWbsId, { suppressFocus: true });
        } else {
          updateRowSelection();
        }
        applyValidationState(currentValidationState);
      }

      function formatCellDisplay(column, value) {
        if (value === undefined || value === null) {
          return '';
        }
        if (column && typeof column.formatter === 'function') {
          try {
            return column.formatter(value);
          } catch {
            return value.toString();
          }
        }
        return value.toString();
      }

      function valuesEqual(previous, next, config) {
        if (config && typeof config.compare === 'function') {
          return config.compare(previous, next);
        }
        return previous === next;
      }

    })();
  </script>
